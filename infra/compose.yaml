name: fpsupportportal

# Local demo stack. The HTTP gateway binds only to loopback; production needs TLS.
x-app-env: &app-env
  APP_ENV: development
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY}
  POSTGRES_DB: support
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: support_app
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  DEV_SCAN_BYPASS: "0"
  AI_API_URL: ${AI_API_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  PRIVATE_STORAGE_ROOT: /var/lib/portal/files
  ALLOWED_HOSTS: 127.0.0.1,localhost,api
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080

x-app-base: &app-base
  build:
    context: ../apps/api
  image: fpsupportportal-api:local
  environment: *app-env
  volumes:
    - support_files:/var/lib/portal/files
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:56432:5432"]
    volumes:
      - support_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_owner -d support"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: redis-server --appendonly yes
    volumes: ["support_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:53310:3310"]
    volumes: ["support_signatures:/var/lib/clamav"]
    restart: unless-stopped

  migrate:
    <<: *app-base
    restart: "no"
    environment:
      <<: *app-env
      POSTGRES_USER: support_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app-base
    restart: "no"
    environment:
      <<: *app-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
    command: python manage.py seed_demo
    depends_on:
      migrate:
        condition: service_completed_successfully

  files-init:
    <<: *app-base
    user: "0:0"
    restart: "no"
    command: sh -c "mkdir -p /var/lib/portal/files && chown -R 10001:10001 /var/lib/portal/files"

  api:
    <<: *app-base
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *app-base
    command: celery -A config.celery:app worker --loglevel=INFO --concurrency=2
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully

  beat:
    <<: *app-base
    command: celery -A config.celery:app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    image: fpsupportportal-web:local
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  support_db:
  support_redis:
  support_signatures:
  support_files:
