# This gateway is intended exclusively for an HTTPS Cloudflare Tunnel origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 21m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    set $portal_api http://api:8000;
    proxy_pass $portal_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # The public connection is HTTPS even though the tunnel origin uses HTTP.
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
